<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Making of the Delhi Metro</title>
    <script src="https://unpkg.com/intersection-observer@0.5.1/intersection-observer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/scrollama/3.0.4/scrollama.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.3.0/d3.min.js"></script>

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <style>
        .with-image-bg {
            position: relative;
            background-size: cover;
            background-position: center;
            margin-bottom: 0;
            min-height: 70svh;
            background-image: url('images/header.png');
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        body {
            margin: 0;
            font-size: 20px;
            font-family: 'Inter';
            text-rendering: optimizeLegibility;
        }
        .content {
            max-width: 640px;
            margin: auto;
        }
        .header {
            padding: 3em 0;
        }
        a {
            font-family: 'Inter';
            color: #18396C;
        }
        .footer {
            background: #E1EEF2;
            text-align: center;
            font-size: 0.8em;
            margin-top: 4em;
            padding: 4em 0;
        }
        figure {
            margin: 0;
            padding-bottom: 1.2em;
        }
        figcaption {
            font-size: 14px;
            font-weight: 300;
            text-align: left;
            margin-bottom: 0.5em;
            padding-bottom: 1em;
            color: #666;
        }
        .header-text {
            width: 45%;
            padding: 1em;
            color: #18396C;
        }
        .header-text h1 {
            color: #18396C;
            font-size: 3.4em;
            margin-top: 0.3em;
            margin-bottom: -0.1em;
            text-wrap: balance;
        }
        .header-text p {
            color: #666;
            font-size: 16px;
        }
        /* Mobile header — hidden on desktop */
        .mobile-header-text {
            display: none;
        }

        h1 {
            font-family: 'Source Serif 4';
            font-weight: 600;
            font-size: 3em;
            line-height: 1.1;
            color: #18396C;
        }
        h2 {
            font-family: 'Source Serif 4';
            color: #3F3F3F;
            font-size: 20px;
            font-weight: 500;
            line-height: 90%;
            padding-bottom: 1em;
            margin: 0.5em 0 0.5em 0;
        }
        iframe,
        img,
        video {
            max-width: 100%;
        }
        img.full-width {
            width: 100vw;
            max-width: 100vw !important;
            display: block;
            margin-left: 50%;
            transform: translateX(-50%);
        }
        p {
            font-family: 'Inter';
            font-weight: 300;
            font-size: 18px;
            line-height: 130%;
            margin: 0;
            padding-bottom: 1em;
            color: #3F3F3F;
        }
        p.emphasis {
            font-family: 'Inter';
            font-weight: 600;
            font-size: 22px;
            line-height: 130%;
            margin: 0;
            padding-bottom: 1em;
            padding-top: 0.5em;
            color: #18396C;
        }
        p2 {
            font-family: 'Inter';
            font-weight: 600;
            font-size: 16px;
            line-height: 130%;
            margin: 0;
            padding-bottom: 1em;
            color: #3F3F3F;
        }
        ul {
            margin: 0;
            padding-bottom: 1em;
            line-height: 1.6;
        }
        iframe {
            padding-bottom: 1.2em;
            color: #3F3F3F;
        }
        code {
            font-family: 'Courier New', monospace;
            background: #fffbaf;
            font-size: 0.85em;
        }
        .full-width figure {
            text-align: center;
        }
        .mango-full-width {
            width: 100%;
        }
        #scrolly {
            position: relative;
            padding: 1rem;
        }
        .scrolly-overlay {
            position: relative;
            padding: 0;
            max-width: 35rem;
            margin-left: 2px;
            margin-right: auto;
        }
        .sticky-thing {
            position: -webkit-sticky;
            position: sticky;
            left: 0;
            width: 100%;
            margin: 0;
            z-index: 0;
            top: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            flex-direction: column;
        }
        .step {
            margin: 0 auto 2rem auto;
            margin-bottom: 50rem;
            background-color: rgba(232, 247, 252, 0.7);
            text-align: left;
            border-radius: 15px;
            border: 0.5px solid #E3E3E3;
        }
        .step p {
            padding: 1rem;
            font-size: 18px;
            line-height: 130%;
        }
        #zoomBox {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .photoDiv {
            width: 100vw;
            height: auto;
            display: block;
            transition:
                margin 1.5s 0s,
                transform 2.5s 0s;
        }
        /* ===================== */
        /* DESKTOP SCROLLYTELLING */
        /* ===================== */
        @media only screen and (min-width: 700px) {
            #scrolly.side-by-side {
                display: flex;
            }
            #scrolly.side-by-side > div {
                flex-basis: 0;
                flex-grow: 1;
                flex-shrink: 1;
                padding: 0.75em;
            }
            #scrolly.side-by-side .scrolly-overlay {
                margin-top: 70vh;
                order: 0;
                min-width: 15rem;
                max-width: 20rem;
            }
            #scrolly.side-by-side .sticky-thing {
                order: 1;
                flex-grow: 2;
            }
        }
        /* ===================== */
        /* MOBILE STYLES         */
        /* ===================== */
        @media (max-width: 700px) {

            body {
                font-size: 16px;
            }

            .content {
                padding-left: 1em;
                padding-right: 1em;
            }
            /* Hide desktop banner text on mobile */
            .with-image-bg {
                min-height: 40svh;
                background-position: center;
                display: block;
                margin-bottom: 0;
            }
            .header-text {
                display: none;
            }
            /* Show mobile header text block */
            .mobile-header-text {
                display: block;
                text-align: center;
                padding: 1.5em 1em;
                background-color: #ffffff;
            }
            .mobile-header-text img {
                display: block;
                margin: 0 auto 0.5em auto;
            }

            .mobile-header-text h1 {
                font-family: 'Source Serif 4';
                color: #18396C;
                font-size: 1.8em;
                line-height: 1.2;
                margin: 0 0 0.3em 0;
                text-wrap: balance;
            }

            .mobile-header-text p.emphasis {
                font-size: 16px;
                padding-bottom: 0.3em;
            }

            .mobile-header-text figcaption {
                text-align: center;
            }

            /* Headings */
            h1 {
                font-size: 2em;
            }

            h2 {
                font-size: 17px;
            }

            /* Body text */
            p {
                font-size: 16px;
            }

            p.emphasis {
                font-size: 18px;
            }

            p2 {
                font-size: 14px;
            }

            figcaption {
                font-size: 13px;
            }
            /* Full width images */
            img.full-width {
                width: 100vw;
                margin-left: 0;
                transform: none;
            }
            /* Scrollytelling */
            #scrolly {
                padding: 0;
            }
            .sticky-thing {
                height: 50vh;
            }
            .photoDiv {
                width: 100vw;
                height: 50vh;
                object-fit: contain;
            }
            #zoomBox {
                width: 100vw;
            }
            .scrolly-overlay {
                margin-top: 0;
                max-width: 100%;
                padding: 0 1em;
            }
            .step {
                margin-bottom: 10rem;
                text-align: left;
            }
            .step p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Desktop banner with text on image -->
    <div class="header with-image-bg">
        <div class="header-text">
            <img src="images/globe.png" alt="A globe icon" width="60" height="60" style="display: block; margin-bottom: 0.3em;">
            <h1>The Making of the Delhi Metro</h1>
            <p class="emphasis">By <a href="https://purvikasharma.com">Purvika Sharma</a></p>
            <figcaption>Published on 01 July, 2026</figcaption>
        </div>
    </div>

    <!-- Mobile header text — image above, text below -->
    <div class="mobile-header-text">
        <img src="images/globe.png" alt="A globe icon" width="50" height="50">
        <h1>The Making of the Delhi Metro</h1>
        <p class="emphasis">By <a href="https://purvikasharma.com">Purvika Sharma</a></p>
        <figcaption>Published on 01 July, 2026</figcaption>
    </div>

    <div class="content">
        <img src="images/icon.png" alt="A train icon" width="70" height="70" style="display: block; margin: 0 auto;">
        <h2>From a single line in 2002 to one of the world's largest metro systems.</h2>
